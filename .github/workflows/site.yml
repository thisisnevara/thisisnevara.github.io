# Обновление и публикация сайта Nevara.
# Запускается: раз в день, при каждой загрузке файлов в main и вручную (Actions → Run workflow).
#
# Если обновление песен не удалось, сайт всё равно публикуется в последней рабочей версии,
# а запуск в конце помечается красным крестиком — GitHub пришлёт письмо, ошибка не пройдёт незамеченной.
name: Update and deploy site

on:
  schedule:
    - cron: "23 6 * * *"      # каждый день в 06:23 UTC (07:23 по Праге зимой, 08:23 летом)
  push:
    branches: [main]
  workflow_dispatch:

# По умолчанию — только чтение. Каждый этап получает лишь те права, которые ему нужны.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # сохранить обновлённый index.html в проект
    outputs:
      tests: ${{ steps.tests.outcome }}
      update: ${{ steps.update.outcome }}
      saved: ${{ steps.save.outputs.saved }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet -r scripts/requirements.txt

      - name: Run tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s scripts -v

      - name: Update releases from YouTube
        id: update
        if: steps.tests.outcome == 'success'      # скрипт с ошибками не трогает сайт
        continue-on-error: true                   # если YouTube не ответил, сайт публикуется как был
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_releases.py index.html

      - name: Save changes to the repository
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "saved=true" >> "$GITHUB_OUTPUT"

          # Новые песни или порядок — сохраняем index.html
          if [ "${{ steps.update.outcome }}" = "success" ] && ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Автообновление: релиз и популярные треки"
          fi

          # GitHub отключает расписание, если в проекте 60 дней не было изменений.
          # Если последнее изменение старше 45 дней — оставляем служебную отметку.
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%F > .github/last-active.txt
            git add .github/last-active.txt
            git commit -m "Служебная отметка: расписание активно"
          fi

          # Отправляем, если есть что; перед этим подтягиваем возможные ручные изменения.
          # При конфликте (вы правили index.html в ту же минуту) ничего не ломаем:
          # отменяем объединение, сайт публикуется, сохранение повторится завтра.
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            if git pull --rebase origin main; then
              git push origin HEAD:main
            else
              git rebase --abort
              echo "saved=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Изменения не сохранены::Конфликт с ручной правкой index.html. Сайт опубликован, сохранение повторится при следующем запуске."
            fi
          fi

      - name: Report problems
        if: steps.tests.outcome != 'success' || steps.update.outcome != 'success'
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            msg="Тесты скрипта не прошли — обновление песен пропущено, сайт опубликован в прошлой версии. Смотрите шаг «Run tests»."
          else
            msg="Не удалось обновить песни с YouTube — сайт опубликован в прошлой версии. Причина в шаге «Update releases from YouTube»."
          fi
          echo "::warning title=Песни не обновлены::$msg"
          echo "### ⚠️ Песни не обновлены" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html favicon.svg nevara-og.jpg CNAME _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write             # опубликовать сайт
      id-token: write          # подтвердить, что публикует именно этот проект
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Сайт уже опубликован. Этот шаг только делает запуск красным, если что-то пошло не так,
  # чтобы GitHub прислал письмо.
  status:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results
        run: |
          ok=true
          [ "${{ needs.build.outputs.tests }}" = "success" ] || { echo "::error::Тесты скрипта не прошли."; ok=false; }
          [ "${{ needs.build.outputs.update }}" = "success" ] || { echo "::error::Песни с YouTube не обновились."; ok=false; }
          [ "${{ needs.build.outputs.saved }}" = "true" ] || { echo "::error::Изменения не сохранены из-за конфликта."; ok=false; }
          [ "${{ needs.deploy.result }}" = "success" ] || { echo "::error::Сайт не опубликован."; ok=false; }
          $ok && echo "Всё в порядке."
          $ok
